apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.appathy.anbee'
    compileSdk 34

    defaultConfig {
        applicationId "com.appathy.anbee"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "2.1.1"
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
